name: Android CI

on:
  push:
    branches: [ "kiwi" ]
  pull_request:
    branches: [ "kiwi" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5  # Обновлено с v4 на v5
    - name: set up JDK 17
      uses: actions/setup-java@v5 # Обновлено с v4 на v5
      with:
        java-version: '17'        # Рекомендуется Java 17 для сборки Android
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build
